# bench —— 四语言基准（Quelmara / C / Go / Python），**基准数字的唯一权威来源**
#
# 为什么不在本机跑：本机开着 VBS（虚拟化安全），实测
#   · 进程创建 447 ms（四个语言的空程序都一样）
#   · 同一份代码 min-of-3 的抖动可达 ±40%（b1_int 单次 59 ms / min-of-5 42 ms）
# 放到干净的 runner 上噪声低一个量级，而且能拿到**多个平台**的数字 ——
# 那才是"适配度"的真实依据。
#
# 两条 Quelmara 列（别混淆）：
#   quelmara   = qlmc（stage-1 自举编译器）产物，**只有 Windows PE 后端**
#   quelmara0  = stage-0（参考编译器）产物，win / linux / macos 三个后端都有
# 于是：
#   · Windows 上 quelmara vs quelmara0 = **后端差距**（同一个语言、同一台机器）
#   · quelmara0 在各平台上 = **同一份源码在不同 CPU/OS 上的适配度**
#   · posix 上没有 quelmara 列不是"跑不过"，是 qlmc 还没有 ELF 后端
#
# job：
#   windows —— 五列全量（qlmc + stage-0 + C/Go/Python）+ 编译器轴
#   posix   —— ubuntu(x86_64) 上跑 stage-0 + C/Go/Python；
#              macOS(arm64) 上只有 C/Go/Python —— **quelmara 在 macOS 上没有后端**：
#              qlmc 只有 PE，stage-0 的 native 是 ELF64（macOS 需要 Mach-O）。
#              缺口记在 docs/07-gaps.md 的平台支持表。
#
# 结果去处：① job summary（人看，带机器信息）② artifact（机器读，保留 90 天）

name: bench

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "每项重复次数（取最小值，默认 5）"
        default: "5"
  push:
    branches: [master]
    paths:
      - "bench/**"
      - "bootstrap/qlmc/**"
      - "tools/stage0/**"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 18 * * 0"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  REPS: ${{ github.event.inputs.reps || '5' }}
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # 数字必须带机器信息，否则跨平台没法比（同一份 C 代码在 ubuntu 与
      # macOS runner 上的 b1_int 能差 2 倍，那是 CPU 差异不是语言差异）。
      - name: 机器信息
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $os  = Get-CimInstance Win32_OperatingSystem
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $line = "CPU: $($cpu.Name.Trim()) / 逻辑核 $($cpu.NumberOfLogicalProcessors) / 内存 $ram GB / $($os.Caption)"
          Write-Output $line
          Add-Content $env:GITHUB_STEP_SUMMARY "> $line"

      # C 编译器：runner 上只有 MSVC，没有 gcc/clang。zig 是单文件、免安装，
      # `zig cc -O2` 就是 clang，用它最省事。
      - name: 装 zig（当 C 编译器）
        shell: pwsh
        run: |
          $v = "0.13.0"
          Invoke-WebRequest "https://ziglang.org/download/$v/zig-windows-x86_64-$v.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\zig-windows-x86_64-$v" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: 自举 qlmc
        run: python tools/stage0/qlm_cli.py build bootstrap/qlmc/qlmc.qma --target win -o build/qlmc.exe

      - name: 语言基准（qlmc + stage-0 + C/Go/Python）
        shell: pwsh
        run: |
          # Tee-Object 会把 python 的退出码吞掉，显式检查一次
          python bench/speed/run.py --langs quelmara c cpp go --reps $env:REPS --markdown 2>&1 | Tee-Object -FilePath bench.md
          if ($LASTEXITCODE -ne 0) { Write-Error "run.py 失败（rc=$LASTEXITCODE）"; exit 1 }

      - name: 编译器轴（qlmc vs stage-0）
        continue-on-error: true
        shell: pwsh
        run: python bench/speed/compiler.py --reps 3 2>&1 | Tee-Object -FilePath compiler.md

      - name: 写 job summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## 语言基准 · Windows"
          Add-Content $env:GITHUB_STEP_SUMMARY 'quelmara = qlmc（自举编译器，PE 后端）；quelmara0 = stage-0（参考编译器）。两者之差 = 后端差距。'
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content bench.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Add-Content $env:GITHUB_STEP_SUMMARY "## 编译器轴（qlmc vs stage-0）"
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content compiler.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-windows
          path: |
            bench.md
            compiler.md
          retention-days: 90

  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 Linux（GCC）
          - os: ubuntu-latest
            arch: x86_64
          # arm64 macOS（Apple Silicon，clang）—— quelmara 在这没有后端，只跑 C/Go/Python
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # v4.01：把对比语言装齐。**每一步都 `|| true`**，因为
      # 某一种语言装不上不该让整条基准确链失败 —— `run.py` 找不到
      # 编译器时会明确跳过并把原因写进结果，不会假装测过。
      - name: 额外对比语言（rust / zig / nim / gfortran）
        # **只在 Linux 上装**：这段脚本下的是 linux-x86_64 的预编译包，
        # macOS（arm64）上会用错格式 —— v4.01 第一次跑就在
        # `zigpkg/zig` 上抛 `OSError: [Errno 8] Exec format error`。
        # macOS 的对比语言留到以后单独适配（brew 装 rust/gfortran 是可行的）。
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -x
          # Rust：官方脚本，装到 ~/.cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal || true
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Zig：直接下预编译包（比包管理器快且版本确定）
          ZV=0.13.0
          curl -sSLo /tmp/zig.tar.xz "https://ziglang.org/download/${ZV}/zig-linux-x86_64-${ZV}.tar.xz" || true
          mkdir -p "$HOME/zigpkg" && tar -xJf /tmp/zig.tar.xz -C "$HOME/zigpkg" --strip-components=1 2>/dev/null || true
          echo "$HOME/zigpkg" >> "$GITHUB_PATH"
          # Nim：用 choosenim（失败就算了）
          curl -sSf https://nim-lang.org/choosenim/init.sh -o /tmp/niminit.sh && sh /tmp/niminit.sh -y || true
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          # Fortran（Ubuntu 预装 gfortran 的概率不低，缺了再装）
          which gfortran || (sudo apt-get update -qq && sudo apt-get install -y -qq gfortran) || true
          true

      - name: 机器信息
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            LINE="CPU: $(sysctl -n machdep.cpu.brand_string) / 逻辑核 $(sysctl -n hw.ncpu) / $(sw_vers -productName) $(sw_vers -productVersion) / arch $(uname -m)"
          else
            LINE="CPU: $(lscpu | awk -F': +' '/Model name/{print $2; exit}') / 逻辑核 $(nproc) / $(. /etc/os-release && echo "$PRETTY_NAME") / arch $(uname -m)"
          fi
          echo "$LINE"
          echo "> $LINE" >> "$GITHUB_STEP_SUMMARY"
          echo "> C 编译器：$(cc --version 2>/dev/null | head -1 || gcc --version | head -1)"

      - name: 自举 qlmc（Linux 也要，quelmara 列靠它）
        # v4.02：qlmc 从 v3.94 起有 ELF 后端，所以 posix 上 quelmara 列终于
        # 能有数了。qlmc 自身是 PE 产物 —— 下面装 wine 来跑它，
        # 它**编出来**的可执行文件是原生 ELF，直接 exec，计时口径与 C/Go 一致。
        if: runner.os == 'Linux'
        run: |
          set -e
          # wine 只为跑编译器本身；产物是原生 ELF，不经过 wine。
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine64 || \
            sudo apt-get install -y -qq --no-install-recommends wine
          wine --version || true
          python tools/stage0/qlm_cli.py build bootstrap/qlmc/qlmc.qma --target win -o build/qlmc.exe
          chmod +x build/qlmc.exe
          file build/qlmc.exe
          ls -la build/qlmc.exe

      - name: 语言基准（quelmara + C/C++/Go/...）
        run: |
          # **必须开 pipefail**：`| tee` 的退出码是 tee 的，会把 python 的
          # 非零退出码吞掉 —— v2.58 第一次跑就踩了（macOS 上 ELF 跑不了，
          # python 抛 OSError，但 step 仍然报成功）。
          set -o pipefail
          # qlmc.exe 是 Windows PE，Linux 上要 wine 包装
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine64 || sudo apt-get install -y -qq --no-install-recommends wine
          export PATH="/usr/bin:$PATH"
          WINE=$(which wine || which wine64 || echo "/usr/bin/wine")
          $WINE --version
          QLMC="$WINE build/qlmc.exe" python bench/speed/run.py --langs quelmara c cpp go rust zig nim fortran --reps "$REPS" --markdown 2>&1 | tee bench.md

      - name: 写 job summary
        if: always()
        run: |
          {
            echo "## 语言基准 · ${{ matrix.os }}（${{ matrix.arch }}）"
            echo 'quelmara0 = stage-0（参考编译器）产物。qlmc 还没有 ELF 后端，所以本平台没有 quelmara 列。'
            echo '```'
            cat bench.md 2>/dev/null || echo "(没跑出来)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench.md
          retention-days: 90
