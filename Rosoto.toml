# Rosoto 根配置文件 —— 全局资源的唯一开关
# 未声明字段取默认值。多核默认开启；禁用多核必须在这里显式声明。

[core]
multicore  = true        # false = 显式禁用多核（单核/单线程）
threads    = 0           # 0 = 自动（物理核数）；>0 = 精确指定
affinity   = "none"      # none | compact | scatter | [0,1,2]
preempt    = true

[net]
backend        = "auto"  # auto | io_uring | epoll | kqueue | iocp
io_threads     = 0
max_conns      = 1000000 # 硬上限，超限拒绝连接
recv_buffer    = 4096
send_buffer    = 4096
tcp_nodelay    = true
reuse_port     = true
backpressure   = "drop"  # drop | close | block

[memory]
arena_default = false
heap_limit_mb = 512

[build]
opt     = "speed"
lto     = true
target  = "native"
bounds_check = true      # false = 去掉定长数组的越界检查（更快，但越界即 UB）
